# The product consumers see: in Developer Hub (API products, key requests) and
# on the console's API Products page. Key requests against it create
# APIKeyRequest objects; approvals create APIKeyApproval objects and the
# enforcement Secret. Those objects are the first audit ledger: who asked, for
# which plan, who approved, when.
apiVersion: devportal.kuadrant.io/v1alpha1
kind: APIProduct
metadata:
  name: price-check-api
  namespace: api-price-check
  annotations:
    backstage.io/owner: user:default/deanpeterson
spec:
  displayName: "Price Check API"
  description: "The price of an item at a given store, for the store app at the shelf."
  version: v1
  approvalMode: manual
  publishStatus: Published
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: price-check-api
  contact:
    team: user:default/deanpeterson
    url: https://v1-developer-hub-rhdh-test.apps.salamander.aimlworkbench.com/catalog/default/component/price-check-api
  documentation:
    docsURL: https://v1-developer-hub-rhdh-test.apps.salamander.aimlworkbench.com/catalog/default/api/price-check-api/definition
    openAPISpecURL: https://raw.githubusercontent.com/enterprisewebservice/price-check-api-gitops/main/openapi.yaml
  tags:
    - rest
    - experimental
